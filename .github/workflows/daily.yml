name: daily-schedule

on:
  schedule:
    - cron: '0 21 * * *' # 06:00 KST
  workflow_dispatch:
  push: # 규칙만 고쳤을 때 바로 반영. 공공데이터 API는 부르지 않는다(설계 6-3)
    branches: [main]
    paths: ['rules/**', 'crawler/auleezip_links.json', '.github/workflows/daily.yml']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: github.event_name != 'push'
        run: node crawler/check.mjs
      - if: github.event_name != 'push'
        run: node crawler/fetch.mjs --out site/schedule.json
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
      # push: 지금 배포본 일정·공고를 그대로 쓴다(둘 중 하나라도 못 받으면 배포하지 않아 지금 배포본이 남는다)
      - if: github.event_name == 'push'
        run: |
          mkdir -p site
          curl -fsS https://juholee97.github.io/cheongyak_blog/schedule.json -o site/schedule.json
          curl -fsS https://juholee97.github.io/cheongyak_blog/notices.json -o site/notices.json
      # 규칙 합치기: 실패해도 일정 배포를 막지 않고 지금 배포본을 쓴다
      - run: node rules/build.mjs --out site/rules.json || curl -fsS https://juholee97.github.io/cheongyak_blog/rules.json -o site/rules.json || echo "rules.json 없음 — 계산기는 안내만 보인다"
      # 공고번호 → 우리의 집 글 주소(달력 상세 창·내 청약 할 일). 실패해도 일정 배포를 막지 않는다
      - run: cp crawler/auleezip_links.json site/auleezip_links.json || echo "auleezip_links.json 없음 — 우리의 집 링크만 빠짐"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
